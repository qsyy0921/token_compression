<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <defs>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 32px; font-weight: 700; fill: #111827; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #4b5563; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #374151; }
      .tiny { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6b7280; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .card-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .card-teal { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; rx: 16; }
      .card-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .card-purple { fill: #faf5ff; stroke: #7e22ce; stroke-width: 2; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowGray); }
      .token { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1; rx: 4; }
      .orange { fill: #fb923c; stroke: #c2410c; stroke-width: 1.5; }
      .teal { fill: #5eead4; stroke: #0f766e; stroke-width: 1.5; }
      .purple { fill: #d8b4fe; stroke: #7e22ce; stroke-width: 1.5; }
      .gray { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="800" fill="#ffffff"/>
  <text class="title" x="60" y="58">对象异常分数 s_i(t) 的计算方式</text>
  <text class="sub" x="60" y="92">异常分数不是手工规则，而是对象 token 在当前视频上下文中对异常判断的语义贡献。</text>

  <rect class="card-blue" x="70" y="150" width="250" height="150"/>
  <text class="label" x="112" y="190">当前对象语义</text>
  <text class="small" x="108" y="220">z_i(t) = Pool(T_i(t))</text>
  <g transform="translate(115 242)">
    <rect class="token" x="0" y="0" width="28" height="28"/>
    <rect class="token orange" x="38" y="0" width="28" height="28"/>
    <rect class="token orange" x="76" y="0" width="28" height="28"/>
    <rect class="token" x="114" y="0" width="28" height="28"/>
  </g>

  <rect class="card-teal" x="70" y="340" width="250" height="150"/>
  <text class="label" x="112" y="380">历史轨迹语义</text>
  <text class="small" x="94" y="410">h_i(t) = TemporalEncoder</text>
  <path d="M108 452 C145 412, 180 478, 230 430" stroke="#0f766e" stroke-width="3" fill="none"/>
  <circle cx="108" cy="452" r="7" fill="#0f766e"/>
  <circle cx="170" cy="460" r="7" fill="#0f766e"/>
  <circle cx="230" cy="430" r="7" fill="#0f766e"/>

  <rect class="card-purple" x="70" y="530" width="250" height="150"/>
  <text class="label" x="100" y="570">局部背景语义</text>
  <text class="small" x="92" y="600">c_i(t) = Pool(周围背景)</text>
  <rect x="112" y="625" width="115" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7"/>
  <rect x="138" y="613" width="62" height="58" rx="8" fill="none" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/>

  <rect class="card-orange" x="420" y="245" width="260" height="170"/>
  <text class="label" x="455" y="287">稀疏对象交互</text>
  <text class="small" x="455" y="318">r_i(t) = RelationPool</text>
  <circle cx="480" cy="362" r="11" fill="#2563eb"/>
  <circle cx="560" cy="340" r="11" fill="#2563eb"/>
  <circle cx="610" cy="382" r="11" fill="#f97316"/>
  <line x1="480" y1="362" x2="560" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="560" y1="340" x2="610" y2="382" stroke="#ea580c" stroke-width="3"/>
  <text class="tiny" x="450" y="402">top-k 高风险邻居：人-人 / 人-车 / 人-包</text>

  <rect class="card" x="420" y="470" width="260" height="130"/>
  <text class="label" x="472" y="512">异常语义 Query</text>
  <text class="small" x="466" y="542">q_motion, q_interaction</text>
  <text class="small" x="482" y="568">q_scene, q_static</text>

  <path class="soft" d="M320 225 C370 225, 385 275, 420 305"/>
  <path class="soft" d="M320 415 C360 410, 390 365, 420 340"/>
  <path class="soft" d="M320 605 C370 590, 390 555, 420 535"/>
  <path class="soft" d="M680 335 H805"/>
  <path class="soft" d="M680 535 H805"/>

  <rect x="805" y="250" width="300" height="240" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text class="label" x="875" y="292">UtilityHead</text>
  <text class="small" x="846" y="326">Cross-Attention + MLP</text>
  <line x1="850" y1="360" x2="1060" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <text class="small" x="845" y="392">q_anomaly 查询对象上下文</text>
  <text class="small" x="850" y="424">输出对象异常分数</text>
  <text class="label" x="893" y="462">s_i(t) ∈ [0,1]</text>

  <path class="arrow" d="M1105 370 H1200"/>

  <rect class="card-teal" x="1210" y="195" width="270" height="125"/>
  <text class="label" x="1268" y="235">压缩优先级</text>
  <text class="small" x="1240" y="267">高分保留，低分压缩</text>
  <text class="tiny" x="1242" y="294">priority = max(s_i, uncertainty)</text>

  <rect class="card-orange" x="1210" y="360" width="270" height="190"/>
  <text class="label" x="1264" y="400">训练监督</text>
  <text class="small" x="1235" y="432">帧级 MIL：max_i s_i(t)</text>
  <text class="small" x="1235" y="462">Mask overlap：对象伪标签</text>
  <text class="small" x="1235" y="492">Ranking：异常对象排前</text>
  <text class="small" x="1235" y="522">Budget：控制 token 数量</text>

  <text class="tiny" x="60" y="746">图注：对象异常分数衡量对象 token group 的异常语义价值，可同时作为异常检测分数和 token 压缩优先级。</text>
</svg>
