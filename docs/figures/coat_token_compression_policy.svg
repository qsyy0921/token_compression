<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 32px; font-weight: 700; fill: #111827; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #4b5563; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #374151; }
      .tiny { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6b7280; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .high { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .mid { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; rx: 16; }
      .low { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 16; }
      .tokenH { fill: #fb923c; stroke: #c2410c; stroke-width: 1.5; rx: 4; }
      .tokenM { fill: #5eead4; stroke: #0f766e; stroke-width: 1.5; rx: 4; }
      .tokenL { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; rx: 4; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .fade { opacity: 0.28; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="760" fill="#ffffff"/>
  <text class="title" x="58" y="58">基于对象异常分数的 Token 压缩策略</text>
  <text class="sub" x="58" y="92">压缩目标不是固定删掉某类对象，而是按对象在当前上下文中的异常语义价值动态保留。</text>

  <rect class="panel" x="60" y="140" width="360" height="540"/>
  <text class="label" x="130" y="180">原始对象 Token Groups</text>
  <text class="small" x="105" y="210">ViT tokens 按对象框分组</text>
  <g transform="translate(105 255)">
    <text class="small" x="0" y="-18">对象 A：高异常分数</text>
    <rect class="tokenH" x="0" y="0" width="30" height="30"/>
    <rect class="tokenH" x="40" y="0" width="30" height="30"/>
    <rect class="tokenH" x="80" y="0" width="30" height="30"/>
    <rect class="tokenH" x="120" y="0" width="30" height="30"/>
    <rect class="tokenH" x="160" y="0" width="30" height="30"/>
    <text class="small" x="0" y="80">对象 B：中等异常分数</text>
    <rect class="tokenM" x="0" y="105" width="30" height="30"/>
    <rect class="tokenM" x="40" y="105" width="30" height="30"/>
    <rect class="tokenM" x="80" y="105" width="30" height="30"/>
    <rect class="tokenM" x="120" y="105" width="30" height="30"/>
    <rect class="tokenM" x="160" y="105" width="30" height="30"/>
    <text class="small" x="0" y="205">对象 C：低异常分数</text>
    <rect class="tokenL" x="0" y="230" width="30" height="30"/>
    <rect class="tokenL" x="40" y="230" width="30" height="30"/>
    <rect class="tokenL" x="80" y="230" width="30" height="30"/>
    <rect class="tokenL" x="120" y="230" width="30" height="30"/>
    <rect class="tokenL" x="160" y="230" width="30" height="30"/>
  </g>

  <path class="arrow" d="M440 410 H535"/>

  <rect class="panel" x="550" y="140" width="390" height="540"/>
  <text class="label" x="625" y="180">Utility-Guided 决策</text>
  <text class="small" x="604" y="210">priority_i(t)=max(s_i(t), uncertainty)</text>

  <rect class="high" x="600" y="260" width="290" height="92"/>
  <text class="label" x="625" y="296">高分对象：完整保留</text>
  <text class="small" x="625" y="324">s_i(t) ≥ 0.7</text>

  <rect class="mid" x="600" y="385" width="290" height="92"/>
  <text class="label" x="625" y="421">中分对象：汇聚摘要</text>
  <text class="small" x="625" y="449">0.4 ≤ s_i(t) &lt; 0.7</text>

  <rect class="low" x="600" y="510" width="290" height="92"/>
  <text class="label" x="625" y="546">低分对象：强压缩</text>
  <text class="small" x="625" y="574">s_i(t) &lt; 0.4 且确定正常</text>

  <path class="arrow" d="M960 410 H1050"/>

  <rect class="panel" x="1070" y="140" width="400" height="540"/>
  <text class="label" x="1164" y="180">送入 LLM 的序列</text>
  <text class="small" x="1130" y="210">压缩视觉 token + 上下文 token</text>

  <g transform="translate(1120 265)">
    <text class="small" x="0" y="-18">高 utility：保留全部</text>
    <rect class="tokenH" x="0" y="0" width="30" height="30"/>
    <rect class="tokenH" x="40" y="0" width="30" height="30"/>
    <rect class="tokenH" x="80" y="0" width="30" height="30"/>
    <rect class="tokenH" x="120" y="0" width="30" height="30"/>
    <rect class="tokenH" x="160" y="0" width="30" height="30"/>
    <text class="small" x="0" y="85">中 utility：K 个摘要 token</text>
    <rect class="tokenM" x="0" y="110" width="30" height="30"/>
    <rect class="tokenM" x="40" y="110" width="30" height="30"/>
    <rect class="tokenM" x="80" y="110" width="30" height="30"/>
    <text class="small" x="0" y="195">低 utility：删除 / 极少摘要</text>
    <rect class="tokenL fade" x="0" y="220" width="30" height="30"/>
    <rect class="tokenL fade" x="40" y="220" width="30" height="30"/>
    <rect class="tokenL" x="95" y="220" width="30" height="30"/>
    <text class="small" x="0" y="315">附加 token</text>
    <rect x="0" y="340" width="82" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="96" y="340" width="82" height="32" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="192" y="340" width="82" height="32" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <text class="tiny" x="9" y="361">轨迹</text>
    <text class="tiny" x="106" y="361">场景</text>
    <text class="tiny" x="202" y="361">异常查询</text>
  </g>

  <text class="tiny" x="58" y="724">图注：对象异常分数同时决定异常检测排序和 token 压缩优先级；不确定对象优先保留，避免误删异常线索。</text>
</svg>
