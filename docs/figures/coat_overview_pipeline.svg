<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #4b5563; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #4b5563; }
      .tiny { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6b7280; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .module { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .ours { fill: #f0fdfa; stroke: #0f766e; stroke-width: 3; rx: 18; }
      .vit { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .llm { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .token-blue { fill: #60a5fa; stroke: #1d4ed8; stroke-width: 1; }
      .token-teal { fill: #5eead4; stroke: #0f766e; stroke-width: 1; }
      .token-gray { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
      .token-orange { fill: #fb923c; stroke: #c2410c; stroke-width: 1.5; }
      .line-teal { stroke: #0f766e; stroke-width: 2; fill: none; }
      .line-orange { stroke: #ea580c; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="720"/>
  <text class="title" x="60" y="62">COAT：上下文感知对象异常 Token 压缩框架</text>
  <text class="subtitle" x="60" y="96">在 Qwen3-VL 的 ViT 与 LLM 之间插入对象级语义压缩模块，优先保留异常相关对象 token。</text>

  <rect class="module" x="60" y="165" width="205" height="390"/>
  <text class="label" x="95" y="205">视频输入</text>
  <text class="small" x="95" y="232">ShanghaiTech clips</text>
  <g transform="translate(93 270)">
    <rect x="0" y="0" width="130" height="76" rx="8" fill="#eef2ff" stroke="#64748b" stroke-width="2"/>
    <circle cx="35" cy="45" r="10" fill="#2563eb"/>
    <circle cx="72" cy="43" r="10" fill="#2563eb"/>
    <circle cx="100" cy="50" r="10" fill="#f97316"/>
    <line x1="30" y1="55" x2="26" y2="70" stroke="#334155" stroke-width="3"/>
    <line x1="74" y1="53" x2="78" y2="70" stroke="#334155" stroke-width="3"/>
    <line x1="100" y1="60" x2="104" y2="72" stroke="#c2410c" stroke-width="3"/>
    <rect x="18" y="24" width="28" height="48" fill="none" stroke="#2563eb" stroke-width="2"/>
    <rect x="88" y="28" width="31" height="45" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  <g transform="translate(112 365)">
    <rect x="0" y="0" width="92" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="12" y="12" width="18" height="18" fill="#bfdbfe"/>
    <rect x="36" y="12" width="18" height="18" fill="#bfdbfe"/>
    <rect x="60" y="12" width="18" height="18" fill="#fed7aa"/>
    <text class="tiny" x="-5" y="75">离线对象框 / track</text>
  </g>

  <path class="arrow" d="M278 360 H355"/>

  <rect class="vit" x="370" y="165" width="235" height="390"/>
  <text class="label" x="420" y="205">Qwen3-VL ViT</text>
  <text class="small" x="410" y="232">生成时空视觉 token</text>
  <g transform="translate(422 270)">
    <g>
      <rect class="token-blue" x="0" y="0" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="34" y="0" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="68" y="0" width="24" height="24" rx="4"/>
      <rect class="token-gray" x="102" y="0" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="136" y="0" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="0" y="34" width="24" height="24" rx="4"/>
      <rect class="token-teal" x="34" y="34" width="24" height="24" rx="4"/>
      <rect class="token-teal" x="68" y="34" width="24" height="24" rx="4"/>
      <rect class="token-gray" x="102" y="34" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="136" y="34" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="0" y="68" width="24" height="24" rx="4"/>
      <rect class="token-teal" x="34" y="68" width="24" height="24" rx="4"/>
      <rect class="token-orange" x="68" y="68" width="24" height="24" rx="4"/>
      <rect class="token-orange" x="102" y="68" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="136" y="68" width="24" height="24" rx="4"/>
      <rect class="token-gray" x="0" y="102" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="34" y="102" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="68" y="102" width="24" height="24" rx="4"/>
      <rect class="token-blue" x="102" y="102" width="24" height="24" rx="4"/>
      <rect class="token-gray" x="136" y="102" width="24" height="24" rx="4"/>
    </g>
  </g>
  <text class="tiny" x="424" y="465">X(t,h,w)：带时空位置的视觉 token</text>

  <path class="arrow" d="M620 360 H694"/>

  <rect class="ours" x="710" y="125" width="500" height="500"/>
  <text class="label" x="795" y="165">对象上下文异常 Utility 模块</text>
  <text class="small" x="780" y="193">从 visual tokens 中提取对象语义并估计异常分数</text>

  <rect class="box" x="755" y="235" width="145" height="110"/>
  <text class="small" x="782" y="263">对象 token</text>
  <text class="tiny" x="776" y="286">z_i(t)</text>
  <rect class="token-orange" x="790" y="305" width="26" height="26" rx="4"/>
  <rect class="token-orange" x="825" y="305" width="26" height="26" rx="4"/>

  <rect class="box" x="940" y="235" width="160" height="110"/>
  <text class="small" x="970" y="263">轨迹语义</text>
  <text class="tiny" x="980" y="286">h_i(t)</text>
  <path class="line-teal" d="M970 318 C990 288, 1020 340, 1060 302"/>
  <circle cx="970" cy="318" r="5" fill="#0f766e"/>
  <circle cx="1015" cy="330" r="5" fill="#0f766e"/>
  <circle cx="1060" cy="302" r="5" fill="#0f766e"/>

  <rect class="box" x="755" y="395" width="145" height="110"/>
  <text class="small" x="780" y="423">局部背景</text>
  <text class="tiny" x="778" y="446">c_i(t)</text>
  <rect x="790" y="462" width="70" height="25" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="804" y="450" width="42" height="52" rx="6" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>

  <rect class="box" x="940" y="395" width="160" height="110"/>
  <text class="small" x="970" y="423">稀疏交互</text>
  <text class="tiny" x="982" y="446">r_i(t)</text>
  <circle cx="980" cy="478" r="9" fill="#2563eb"/>
  <circle cx="1040" cy="463" r="9" fill="#2563eb"/>
  <circle cx="1065" cy="493" r="9" fill="#f97316"/>
  <line x1="980" y1="478" x2="1040" y2="463" stroke="#64748b" stroke-width="2"/>
  <line x1="1040" y1="463" x2="1065" y2="493" stroke="#f97316" stroke-width="2"/>

  <path class="arrow" d="M900 290 H934"/>
  <path class="arrow" d="M900 450 H934"/>
  <path class="arrow" d="M1018 348 V386"/>
  <path class="arrow" d="M1110 450 H1150 V360 H1130"/>

  <rect x="1115" y="300" width="150" height="100" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="small" x="1142" y="337">异常 Query</text>
  <text class="tiny" x="1137" y="361">q_anomaly</text>
  <text class="tiny" x="1135" y="384">UtilityHead</text>

  <text class="small" x="810" y="575">输出：对象异常分数 s_i(t) 与 token 保留优先级</text>

  <path class="arrow" d="M1225 360 H1295"/>

  <rect class="module" x="1310" y="165" width="200" height="390"/>
  <text class="label" x="1342" y="205">压缩后 token</text>
  <text class="small" x="1335" y="232">保留 / 汇聚 / 删除</text>
  <g transform="translate(1375 280)">
    <rect class="token-orange" x="0" y="0" width="30" height="30" rx="5"/>
    <rect class="token-orange" x="0" y="42" width="30" height="30" rx="5"/>
    <rect class="token-teal" x="0" y="84" width="30" height="30" rx="5"/>
    <rect class="token-blue" x="0" y="126" width="30" height="30" rx="5"/>
    <rect class="token-gray" x="0" y="168" width="30" height="30" rx="5" opacity="0.35"/>
    <circle cx="15" cy="230" r="4" fill="#94a3b8"/>
    <circle cx="15" cy="248" r="4" fill="#94a3b8"/>
  </g>

  <path class="arrow" d="M1515 360 H1560"/>
  <rect class="llm" x="1320" y="585" width="250" height="70"/>
  <text class="small" x="1345" y="618">送入 LLM：异常判断 / 解释</text>
  <text class="tiny" x="1370" y="642">visual tokens + context tokens</text>
</svg>
